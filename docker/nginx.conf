server {
    listen 80;
    listen [::]:80;
    server_name www.bricksmusicfestival.com;

    # Canonical host: 301 every www request to the non-www equivalent,
    # preserving path and query string. TLS terminates at the upstream
    # proxy, so redirect straight to https to avoid a double hop.
    return 301 https://bricksmusicfestival.com$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;
    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Default 4KB e' insufficiente quando Laravel/Inertia/Twill mandano
        # cookie sessione + XSRF + Inertia version + Set-Cookie multipli:
        # nginx restituisce 502 con "upstream sent too big header".
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
